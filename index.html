    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Gradient background: dark black at the bottom fading to white at the top */
            background-color: #000000;
            background-image: linear-gradient(to top, #020408 0%, #0d1424 50%, #f1f5f9 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .font-script {
            font-family: 'Caveat', cursive;
        }

        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Subtle floating motion for the cube wrapper */
        @keyframes cubeFloat {
            0%, 100% {
                transform: translate(0px, 0px);
            }
            25% {
                transform: translate(-4px, -5px);
            }
            50% {
                transform: translate(3px, -2px);
            }
            75% {
                transform: translate(4px, 4px);
            }
        }

        .cube-floating-wrapper {
            animation: cubeFloat 6.5s ease-in-out infinite;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.65)) drop-shadow(0 10px 15px rgba(37, 99, 235, 0.15));
        }

        /* Isometric Cube Face Interactions */
        .cube-face {
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .cube-face .face-bg {
            transition: fill 0.35s ease, fill-opacity 0.35s ease;
        }

        .cube-face:hover .face-bg-dev,
        .cube-face.is-active .face-bg-dev {
            fill: #dc2626;
            fill-opacity: 0.25;
        }

        .cube-face:hover .face-bg-des,
        .cube-face.is-active .face-bg-des {
            fill: #059669;
            fill-opacity: 0.25;
        }

        .cube-face:hover .face-bg-ana,
        .cube-face.is-active .face-bg-ana {
            fill: #2563eb;
            fill-opacity: 0.25;
        }

        .cube-face:hover .face-title,
        .cube-face.is-active .face-title {
            filter: drop-shadow(0 0 12px currentColor);
        }

        /* Background Fading Keywords inside Cube Faces */
        @keyframes keywordPulse {
            0%, 100% { opacity: 0.14; transform: scale(0.97); }
            50% { opacity: 0.52; transform: scale(1.03); }
        }

        .bg-keyword {
            animation: keywordPulse 5s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }

        /* Wireframe Vertex Nodes */
        .vertex-node {
            fill: #090d16;
            stroke: #e2e8f0;
            stroke-width: 2.5;
            transition: stroke 0.3s ease;
        }

        .cube-container:hover .vertex-node {
            stroke: #ffffff;
        }

        /* Faster Light ray animation across logo */
        @keyframes lightRay {
            0% { transform: translateX(-180%) skewX(-25deg); opacity: 0; }
            15% { opacity: 0.85; }
            35% { transform: translateX(320%) skewX(-25deg); opacity: 0; }
            100% { transform: translateX(320%) skewX(-25deg); opacity: 0; }
        }

        .logo-light-ray {
            animation: lightRay 3.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        }

        /* Realistic crisp white optical lens flare sparkle in corner */
        @keyframes realisticSparkle {
            0%, 24%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
            30% { transform: scale(1.25) rotate(22deg); opacity: 1; }
            35% { transform: scale(0.85) rotate(45deg); opacity: 0.95; }
            42% { transform: scale(1.1) rotate(68deg); opacity: 0.7; }
            50% { transform: scale(0) rotate(90deg); opacity: 0; }
        }

        .sparkle-star {
            animation: realisticSparkle 3.2s ease-out infinite;
        }

        /* Callout Box Transition */
        #callout-card {
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Connecting Line SVG Overlay */
        #connection-overlay {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 30;
            overflow: visible;
        }

        .connector-line {
            stroke: rgba(255, 255, 255, 0.5);
            stroke-width: 2;
            stroke-dasharray: 6 4;
            animation: dashMove 1.5s linear infinite;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .connector-line.active {
            opacity: 1;
        }

        @keyframes dashMove {
            to {
                stroke-dashoffset: -20;
            }
        }
    </style>
</head>

    <!-- Real-Time 3D Center-Axis Projection & Timed Spotlight Script -->
    <script>
        // --- 1. TRUE 3D CUBE CENTER-AXIS OSCILLATION ENGINE ---
        // Projects real 3D cube vertices into 2D SVG coordinates so faces & vertices
        // genuinely foreshorten and rotate in 3D space around the cube's center axis.
        const CX = 220;
        const CY = 220;
        const HALF_SIZE = 108;

        // 8 vertices of a cube centered at (0,0,0)
        // Base orientation: +Y is UP in 3D space (inverted to SVG Y), +Z points toward viewer
        const baseVertices = {
            ULF: [-HALF_SIZE,  HALF_SIZE,  HALF_SIZE], // Upper-Left-Front
            URF: [ HALF_SIZE,  HALF_SIZE,  HALF_SIZE], // Upper-Right-Front
            URB: [ HALF_SIZE,  HALF_SIZE, -HALF_SIZE], // Upper-Right-Back (Top peak)
            ULB: [-HALF_SIZE,  HALF_SIZE, -HALF_SIZE], // Upper-Left-Back
            LLF: [-HALF_SIZE, -HALF_SIZE,  HALF_SIZE], // Lower-Left-Front (Bottom peak)
            LRF: [ HALF_SIZE, -HALF_SIZE,  HALF_SIZE], // Lower-Right-Front
            LRB: [ HALF_SIZE, -HALF_SIZE, -HALF_SIZE], // Lower-Right-Back
            LLB: [-HALF_SIZE, -HALF_SIZE, -HALF_SIZE]  // Lower-Left-Back
        };

        // Base isometric angles: 45 deg around Y axis, ~35.264 deg (arcsin(1/sqrt(3))) around X axis
        const BASE_YAW = Math.PI / 4;
        const BASE_PITCH = 0.61548;

        function rotate3D([x, y, z], yaw, pitch, roll) {
            // 1. Yaw (around vertical Y axis)
            let cosY = Math.cos(yaw), sinY = Math.sin(yaw);
            let x1 = x * cosY + z * sinY;
            let y1 = y;
            let z1 = -x * sinY + z * cosY;

            // 2. Pitch (around horizontal X axis)
            let cosP = Math.cos(pitch), sinP = Math.sin(pitch);
            let x2 = x1;
            let y2 = y1 * cosP - z1 * sinP;
            let z2 = y1 * sinP + z1 * cosP;

            // 3. Subtle Roll (around Z axis)
            let cosR = Math.cos(roll), sinR = Math.sin(roll);
            let x3 = x2 * cosR - y2 * sinR;
            let y3 = x2 * sinR + y2 * cosR;
            let z3 = z2;

            // Subtle perspective foreshortening for authentic 3D depth
            const focal = 950;
            const scale = focal / (focal - z3);
            return [CX + x3 * scale, CY - y3 * scale];
        }

        // Convert two 2D edge vectors (u = right edge, v = down edge) of a parallelogram face into an SVG affine matrix
        function setAffineTransform(el, origin, pRight, pDown, centerLocalX, centerLocalY) {
            const ux = pRight[0] - origin[0];
            const uy = pRight[1] - origin[1];
            const vx = pDown[0] - origin[0];
            const vy = pDown[1] - origin[1];

            // Center of the face in 2D
            const fcX = origin[0] + 0.5 * ux + 0.5 * vx;
            const fcY = origin[1] + 0.5 * uy + 0.5 * vy;

            // Normalized scale factors relative to default isometric face length (~182px)
            const a = ux / 182;
            const b = uy / 182;
            const c = vx / 188;
            const d = vy / 188;

            const e = fcX - (a * centerLocalX + c * centerLocalY);
            const f = fcY - (b * centerLocalX + d * centerLocalY);
            el.setAttribute('transform', `matrix(${a.toFixed(4)} ${b.toFixed(4)} ${c.toFixed(4)} ${d.toFixed(4)} ${e.toFixed(2)} ${f.toFixed(2)})`);
        }

        function setFaceLabelTransform(el, origin, pRight, pDown) {
            const ux = pRight[0] - origin[0];
            const uy = pRight[1] - origin[1];
            const vx = pDown[0] - origin[0];
            const vy = pDown[1] - origin[1];

            const fcX = origin[0] + 0.5 * ux + 0.5 * vx;
            const fcY = origin[1] + 0.5 * uy + 0.5 * vy;

            const a = ux / 182;
            const b = uy / 182;
            const c = vx / 188;
            const d = vy / 188;

            el.setAttribute('transform', `matrix(${a.toFixed(4)} ${b.toFixed(4)} ${c.toFixed(4)} ${d.toFixed(4)} ${fcX.toFixed(2)} ${fcY.toFixed(2)})`);
        }

        const ptsStr = (...pts) => pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

        function setNode(id, pt) {
            const el = document.getElementById(id);
            if (el) {
                el.setAttribute('cx', pt[0].toFixed(1));
                el.setAttribute('cy', pt[1].toFixed(1));
            }
        }

        function setLine(id, p1, p2) {
            const el = document.getElementById(id);
            if (el) {
                el.setAttribute('x1', p1[0].toFixed(1));
                el.setAttribute('y1', p1[1].toFixed(1));
                el.setAttribute('x2', p2[0].toFixed(1));
                el.setAttribute('y2', p2[1].toFixed(1));
            }
        }

        // Track live face centers in SVG coordinates for the dynamic connector line
        let liveFaceCenters = {
            'face-designer': [139, 262],
            'face-developer': [220, 126],
            'face-analyst': [301, 262]
        };

        function animateCube3D(timestamp) {
            const t = timestamp * 0.001; // seconds

            // Gentle, organic 3D rotational oscillation around the cube's center axis
            const yaw   = BASE_YAW   + Math.sin(t * 0.85) * 0.14;
            const pitch = BASE_PITCH + Math.cos(t * 0.65) * 0.09;
            const roll  = Math.sin(t * 0.50) * 0.045;

            const p = {};
            for (const key in baseVertices) {
                p[key] = rotate3D(baseVertices[key], yaw, pitch, roll);
            }

            // Update Top Face (Developer): ULB -> URB -> URF -> ULF
            const topPts = ptsStr(p.ULB, p.URB, p.URF, p.ULF);
            document.getElementById('poly-top').setAttribute('points', topPts);
            document.getElementById('clip-poly-top').setAttribute('points', topPts);
            setFaceLabelTransform(document.getElementById('label-top'), p.ULB, p.URB, p.ULF);
            setAffineTransform(document.getElementById('kw-top'), p.ULB, p.URB, p.ULF, 220, 126);

            // Update Left Face (Designer): ULB -> ULF -> LLF -> LLB
            const leftPts = ptsStr(p.ULB, p.ULF, p.LLF, p.LLB);
            document.getElementById('poly-left').setAttribute('points', leftPts);
            document.getElementById('clip-poly-left').setAttribute('points', leftPts);
            setFaceLabelTransform(document.getElementById('label-left'), p.ULB, p.ULF, p.LLB);
            setAffineTransform(document.getElementById('kw-left'), p.ULB, p.ULF, p.LLB, 139, 262);

            // Update Right Face (Data Analyst): ULF -> URF -> LRF -> LLF
            const rightPts = ptsStr(p.ULF, p.URF, p.LRF, p.LLF);
            document.getElementById('poly-right').setAttribute('points', rightPts);
            document.getElementById('clip-poly-right').setAttribute('points', rightPts);
            setFaceLabelTransform(document.getElementById('label-right'), p.ULF, p.URF, p.LLF);
            setAffineTransform(document.getElementById('kw-right'), p.ULF, p.URF, p.LLF, 301, 262);

            // Update Outer & Inner Wireframe Edges
            document.getElementById('wire-outer').setAttribute('points', ptsStr(p.URB, p.URF, p.LRF, p.LLF, p.LLB, p.ULB));
            setLine('wire-spoke-left', p.ULF, p.ULB);
            setLine('wire-spoke-right', p.ULF, p.URF);
            setLine('wire-spoke-down', p.ULF, p.LLF);

            // Update Hidden Back Edges
            setLine('hidden-edge-1', p.URB, p.LRB);
            setLine('hidden-edge-2', p.LLB, p.LRB);
            setLine('hidden-edge-3', p.LRF, p.LRB);
            setNode('node-back', p.LRB);

            // Update 7 Visible Vertex Nodes
            setNode('node-top', p.URB);
            setNode('node-ul', p.ULB);
            setNode('node-ur', p.URF);
            setNode('node-center', p.ULF);
            setNode('node-ll', p.LLB);
            setNode('node-lr', p.LRF);
            setNode('node-bottom', p.LLF);

            // Store live 2D centroids of each face for the spotlight connector line
            liveFaceCenters['face-developer'] = [(p.ULB[0] + p.URF[0]) * 0.5, (p.ULB[1] + p.URF[1]) * 0.5];
            liveFaceCenters['face-designer']  = [(p.ULB[0] + p.LLF[0]) * 0.5, (p.ULB[1] + p.LLF[1]) * 0.5];
            liveFaceCenters['face-analyst']   = [(p.ULF[0] + p.LRF[0]) * 0.5, (p.ULF[1] + p.LRF[1]) * 0.5];

            // Keep connector line locked onto moving face center while active
            if (activeSpotlightFaceId) {
                updateConnectorLine(activeSpotlightFaceId);
            }

            requestAnimationFrame(animateCube3D);
        }

        // --- 2. TIMED SPOTLIGHT CYCLE & DYNAMIC CONNECTOR LINE ---
        const spotlights = [
            {
                pillar: 'Designer',
                text: 'BSc Honors MMG - Benjamin Boothroyd Prize',
                href: 'designer.html',
                faceId: 'face-designer',
                dotClass: 'bg-emerald-400',
                labelClass: 'text-emerald-400',
                borderClass: 'border-emerald-500/40'
            },
            {
                pillar: 'Developer',
                text: 'Over 10 years C#',
                href: 'developer.html',
                faceId: 'face-developer',
                dotClass: 'bg-red-400',
                labelClass: 'text-red-400',
                borderClass: 'border-red-500/40'
            },
            {
                pillar: 'Data Analyst',
                text: 'LeepGroup Bootcamp, SQL, Python, Excel',
                href: 'dataanalyst.html',
                faceId: 'face-analyst',
                dotClass: 'bg-blue-400',
                labelClass: 'text-blue-400',
                borderClass: 'border-blue-500/40'
            }
        ];

        const card = document.getElementById('callout-card');
        const dot = document.getElementById('callout-dot');
        const pillarEl = document.getElementById('callout-pillar');
        const textEl = document.getElementById('callout-text');
        const connectorLine = document.getElementById('blurb-connector');
        const mainContainer = document.querySelector('main');
        const cubeSvg = document.getElementById('cube-svg');

        let currentIndex = 0;
        let activeSpotlightFaceId = null;

        function clearActiveFaces() {
            spotlights.forEach(item => {
                const el = document.getElementById(item.faceId);
                if (el) el.classList.remove('is-active');
            });
            connectorLine.classList.remove('active');
            activeSpotlightFaceId = null;
        }

        function updateConnectorLine(faceId) {
            const cardRect = card.getBoundingClientRect();
            const mainRect = mainContainer.getBoundingClientRect();
            const svgRect = cubeSvg.getBoundingClientRect();

            const cardBottomX = (cardRect.left + cardRect.width / 2) - mainRect.left;
            const cardBottomY = cardRect.bottom - mainRect.top;

            const [svgX, svgY] = liveFaceCenters[faceId];
            const targetX = (svgRect.left - mainRect.left) + (svgX / 440) * svgRect.width;
            const targetY = (svgRect.top - mainRect.top) + (svgY / 450) * svgRect.height;

            connectorLine.setAttribute('x1', cardBottomX);
            connectorLine.setAttribute('y1', cardBottomY);
            connectorLine.setAttribute('x2', targetX);
            connectorLine.setAttribute('y2', targetY);
            
            connectorLine.classList.add('active');
        }

        function triggerNextSpotlight() {
            const item = spotlights[currentIndex];

            card.href = item.href;
            pillarEl.textContent = item.pillar;
            textEl.textContent = item.text;

            dot.className = `w-2 h-2 rounded-full animate-pulse ${item.dotClass}`;
            pillarEl.className = `text-[10px] sm:text-xs font-mono-tech uppercase tracking-widest font-semibold ${item.labelClass}`;
            card.className = `w-full px-5 py-3.5 rounded-xl bg-slate-900/95 backdrop-blur-md border ${item.borderClass} shadow-2xl flex items-center justify-between gap-3 group opacity-100 translate-y-0 pointer-events-auto`;

            clearActiveFaces();
            activeSpotlightFaceId = item.faceId;
            const activeFace = document.getElementById(item.faceId);
            if (activeFace) activeFace.classList.add('is-active');
            
            requestAnimationFrame(() => {
                updateConnectorLine(item.faceId);
            });

            setTimeout(() => {
                card.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
                card.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
                clearActiveFaces();
            }, 2000);

            currentIndex = (currentIndex + 1) % spotlights.length;
            setTimeout(triggerNextSpotlight, 3000);
        }

        // Start 3D cube loop & spotlight cycle
        requestAnimationFrame(animateCube3D);
        setTimeout(triggerNextSpotlight, 600);
    </script>
</body>
</html>
