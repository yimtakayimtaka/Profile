<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Builda | Developer | HAQmedia 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="w-full px-4 sm:px-6 py-4 flex items-center justify-between border-b border-white/10 backdrop-blur-md bg-slate-950/90 sticky top-0 z-50">
        <div class="flex items-center space-x-2 text-[11px] sm:text-xs overflow-hidden">
            <a href="index.html" class="flex items-center space-x-0.5 flex-shrink-0">
                <span class="bg-[#111111] text-white font-black px-1.5 py-0.5 text-[10px] border border-white/20">HAQ</span>
                <span class="bg-white text-black font-semibold px-1.5 py-0.5 text-[10px] border border-white/20">media</span>
            </a>
            <span class="text-slate-600">/</span>
            <a href="developer.html" class="text-red-400 hover:underline uppercase flex-shrink-0">Developer</a>
            <span class="text-slate-600">/</span>
            <span class="text-white font-mono truncate">Mobile Builda</span>
        </div>
        <a href="developer.html" class="text-xs text-slate-400 hover:text-white flex-shrink-0">&larr; Back</a>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10 flex-1 w-full">
        <span class="text-xs font-mono uppercase tracking-wider bg-red-950/50 border-red-500/20 text-red-300 px-2 py-1 rounded border">Developer Sub-Project</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-4 mb-4">Mobile Builda</h1>

        <!-- Project Description (from desc.txt or .doc) -->
        <p class="text-slate-400 italic text-xs sm:text-sm">Project overview and technical details coming soon.</p>

        
        <!-- MP4 Video Player with Play / Pause / Stop / Mute -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-mono uppercase tracking-wider text-slate-400">Project Video Showcase</h2>
                <span class="text-[11px] font-mono text-slate-500">MobileBuilda.mp4</span>
            </div>
            <div class="bg-slate-900/90 border border-white/10 rounded-xl overflow-hidden shadow-xl">
                <video id="proj-video-0" class="w-full max-h-[480px] bg-black object-contain" controls playsinline preload="metadata">
                    <source src="Developer/MobileBuilda/MobileBuilda.mp4" type="video/mp4">
                    Your browser does not support HTML5 video.
                </video>
                <div class="px-4 py-3 bg-slate-950/90 border-t border-white/10 flex flex-wrap items-center gap-2">
                    <button type="button" onclick="document.getElementById('proj-video-0').play()" class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-semibold transition-colors">&#9654; Play</button>
                    <button type="button" onclick="document.getElementById('proj-video-0').pause()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition-colors">&#10074;&#10074; Pause</button>
                    <button type="button" onclick="const v=document.getElementById('proj-video-0'); v.pause(); v.currentTime=0;" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition-colors">&#9632; Stop</button>
                    <button type="button" onclick="const v=document.getElementById('proj-video-0'); v.muted=!v.muted; this.textContent=v.muted ? 'Unmute' : 'Mute';" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold transition-colors">Mute</button>
                </div>
            </div>
        </section>

        
        <!-- Responsive Image Carousel with Thumbnails & Touch Swipe -->
        <section class="mb-8">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-mono uppercase tracking-wider text-slate-400">Project Gallery</h2>
                <span id="carousel-counter" class="text-xs font-mono text-slate-400">1 / 9</span>
            </div>
            <div class="relative bg-slate-900/90 border border-white/10 rounded-xl overflow-hidden shadow-xl">
                <div class="relative aspect-video w-full bg-black/80 flex items-center justify-center overflow-hidden">
                    <img id="carousel-main-img" src="Developer/MobileBuilda/mb1_f.jpg" alt="Mobile Builda preview" onclick="openLightbox()" class="max-h-full max-w-full object-contain cursor-zoom-in select-none">
                    <button type="button" onclick="prevSlide()" aria-label="Previous image" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-slate-950/80 border border-white/15 text-white flex items-center justify-center hover:bg-red-600/80 transition-colors">&#10094;</button>
                    <button type="button" onclick="nextSlide()" aria-label="Next image" class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-slate-950/80 border border-white/15 text-white flex items-center justify-center hover:bg-red-600/80 transition-colors">&#10095;</button>
                    <button type="button" onclick="openLightbox()" class="absolute bottom-2.5 right-2.5 px-2.5 py-1 rounded-md bg-slate-950/80 border border-white/15 text-[10px] font-mono text-slate-300 hover:text-white">Expand &#x26F6;</button>
                </div>
                <div id="carousel-thumbs" class="p-3 bg-slate-950/80 border-t border-white/10 flex items-center gap-2 overflow-x-auto">
                    <button type="button" onclick="selectSlide(0)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-red-400"><img src="Developer/MobileBuilda/mb1_f.jpg" alt="Thumb 1" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(1)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb2_f.jpg" alt="Thumb 2" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(2)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb3_f.jpg" alt="Thumb 3" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(3)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb4_f.jpg" alt="Thumb 4" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(4)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb5_f.jpg" alt="Thumb 5" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(5)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb6_f.jpg" alt="Thumb 6" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(6)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb7_f.jpg" alt="Thumb 7" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(7)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb8_f.jpg" alt="Thumb 8" class="w-full h-full object-cover" loading="lazy"></button><button type="button" onclick="selectSlide(8)" class="carousel-thumb flex-shrink-0 w-16 h-12 sm:w-20 sm:h-14 rounded-lg overflow-hidden border-2 transition-all bg-slate-950 border-white/10 opacity-60 hover:opacity-100"><img src="Developer/MobileBuilda/mb9_f.jpg" alt="Thumb 9" class="w-full h-full object-cover" loading="lazy"></button>
                </div>
            </div>
        </section>

        <!-- Fullscreen Lightbox Modal -->
        <div id="lightbox-modal" onclick="closeLightbox(event)" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
            <button type="button" onclick="closeLightbox(event)" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white text-lg flex items-center justify-center">&times;</button>
            <button type="button" onclick="prevSlide(event)" class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white text-xl flex items-center justify-center">&#10094;</button>
            <button type="button" onclick="nextSlide(event)" class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white text-xl flex items-center justify-center">&#10095;</button>
            <img id="lightbox-img" src="Developer/MobileBuilda/mb1_f.jpg" alt="Expanded view" class="max-h-[88vh] max-w-[92vw] object-contain rounded-lg shadow-2xl">
        </div>

        <script>
            const galleryImages = ["Developer/MobileBuilda/mb1_f.jpg", "Developer/MobileBuilda/mb2_f.jpg", "Developer/MobileBuilda/mb3_f.jpg", "Developer/MobileBuilda/mb4_f.jpg", "Developer/MobileBuilda/mb5_f.jpg", "Developer/MobileBuilda/mb6_f.jpg", "Developer/MobileBuilda/mb7_f.jpg", "Developer/MobileBuilda/mb8_f.jpg", "Developer/MobileBuilda/mb9_f.jpg"];
            let currentSlide = 0;

            function selectSlide(idx) {
                currentSlide = (idx + galleryImages.length) % galleryImages.length;
                document.getElementById('carousel-main-img').src = galleryImages[currentSlide];
                const lbImg = document.getElementById('lightbox-img');
                if (lbImg) lbImg.src = galleryImages[currentSlide];
                document.getElementById('carousel-counter').textContent = `${currentSlide + 1} / ${galleryImages.length}`;
                document.querySelectorAll('.carousel-thumb').forEach((el, i) => {
                    el.classList.toggle('border-red-400', i === currentSlide);
                    el.classList.toggle('border-white/10', i !== currentSlide);
                    el.classList.toggle('opacity-60', i !== currentSlide);
                    if (i === currentSlide) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                });
            }
            function nextSlide(e) { if (e) e.stopPropagation(); selectSlide(currentSlide + 1); }
            function prevSlide(e) { if (e) e.stopPropagation(); selectSlide(currentSlide - 1); }
            function openLightbox() { document.getElementById('lightbox-modal').classList.remove('hidden'); }
            function closeLightbox(e) {
                if (e && e.target.id === 'lightbox-img') return;
                document.getElementById('lightbox-modal').classList.add('hidden');
            }

            let touchStartX = 0;
            const mainImg = document.getElementById('carousel-main-img');
            mainImg.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            mainImg.addEventListener('touchend', e => {
                const diff = e.changedTouches[0].screenX - touchStartX;
                if (Math.abs(diff) > 40) diff < 0 ? nextSlide() : prevSlide();
            }, { passive: true });
            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === 'Escape') closeLightbox();
            });
        </script>

        <div class="flex flex-wrap gap-3">
            <a href="developer.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs rounded-lg transition-colors">&larr; Back to Developer</a>
        </div>
    </main>

    <footer class="w-full px-4 py-4 text-center text-xs text-slate-500 border-t border-white/5">
        &copy; 2026 HAQmedia 3D. All rights reserved.
    </footer>
</body>
</html>
